



<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MRDJB87 | Home</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b1120;
      color: #ffffff;
      line-height: 1.6;
    }

    header {
      background: #111c32;
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #263653;
    }

    header h1 {
      color: #60a5fa;
      font-size: 28px;
      letter-spacing: 2px;
    }

    nav {
      margin-top: 12px;
    }

    nav a {
      color: #ffffff;
      text-decoration: none;
      margin: 0 12px;
      font-weight: bold;
    }

    nav a:hover {
      color: #60a5fa;
    }

    .hero {
      min-height: 70vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px 20px;
      background: linear-gradient(135deg, #111c32, #172d50);
    }

    .hero h2 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    .hero h2 span {
      color: #60a5fa;
    }

    .hero p {
      max-width: 600px;
      color: #cbd5e1;
      font-size: 18px;
      margin-bottom: 25px;
    }

    .button {
      display: inline-block;
      background: #2563eb;
      color: white;
      padding: 12px 25px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    .button:hover {
      background: #1d4ed8;
      transform: translateY(-2px);
    }

    section {
      padding: 70px 20px;
      text-align: center;
    }

    section h2 {
      color: #60a5fa;
      font-size: 30px;
      margin-bottom: 20px;
    }

    .contact p {
      color: #cbd5e1;
      margin-bottom: 25px;
    }

    footer {
      background: #111c32;
      text-align: center;
      padding: 20px;
      color: #94a3b8;
      border-top: 1px solid #263653;
    }

    @media (max-width: 600px) {
      .hero h2 {
        font-size: 32px;
      }

      nav a {
        margin: 0 8px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>MRDJB87</h1>

    <nav>
      <a href="#home">Home</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <div class="hero" id="home">
      <h2>Welcome to <span>MRDJB87</span></h2>

      <p>
        Welcome to my personal website!
        Feel free to explore and join my Discord community.
      </p>

      <a
        href="https://discord.gg/89T8EZjgwD"
        class="button"
        target="_blank"
        rel="noopener noreferrer"
      >
        Join My Discord
      </a>
    </div>

    <section class="contact" id="contact">
      <h2>Contact Me</h2>

      <p>
        Want to get in touch or join the community?
        Click the button below!
      </p>

      <a
        href="https://discord.gg/89T8EZjgwD"
        class="button"
        target="_blank"
        rel="noopener noreferrer"
      >
        My Discord Server
      </a>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 MRDJB87. All rights reserved.</p>
  </footer>

</body>
</html>
